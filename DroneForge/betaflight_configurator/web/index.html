<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Betaflight Configurator (DroneForge)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="icons/logo.svg"><link rel="stylesheet" href="css/style.css"></head>
<body>
<header id="top">
  <div class="logo"><span class="b">BETAFLIGHT</span><span class="c">Configurator (DroneForge)</span><span id="demoTag" hidden>DEMO</span></div>
  <div class="conn">
    <select id="port" title="Serial port"></select>
    <button id="refresh" class="icon" title="Refresh ports">&#x21bb;</button>
    <select id="baud" title="Baud rate"><option>115200</option><option>57600</option><option>230400</option><option>460800</option><option>921600</option><option>9600</option></select>
    <button id="connect" class="orange">CONNECT</button>
  </div>
</header>
<div id="banners"></div>
<div id="main"><nav id="tabs"></nav><section id="content"></section></div>
<div id="btnbar"><span id="pending"></span><button id="applyBtn">Apply changes</button><button id="rebootBtn">Reboot</button><button id="saveBtn" class="orange">Save and Reboot</button></div>
<footer id="status">
  <span>Packet error: <b id="s-pkt">0</b></span><span>I2C error: <b id="s-i2c">0</b></span><span>Cycle Time: <b id="s-cyc">0</b> us</span><span>CPU Load: <b id="s-cpu">0</b>%</span>
  <span>Mode: <b id="s-mode" class="mode off">OFFLINE</b></span><span id="s-msg"></span><span class="sp"></span><button id="liveBtn" hidden>Back to live (reboot)</button>
</footer>
<script src="js/demo.js"></script><script src="js/core.js"></script><script src="js/pages.js"></script><script src="js/app.js"></script>
</body></html>
